<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>多直播觀看工具 Made by Okowa</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100vw;
  height: 100vh;
  background: #000;
  overflow: hidden;
}

/* 2x2 網格，剛好填滿整個螢幕 */
#container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  width: 100%;
  height: 100%;
  gap: 8px;
  padding: 8px;
}

.stream-box {
  position: relative;
  background: #1e1e1e;
  border-radius: 8px;
  overflow: hidden;
}

.stream-box iframe {
  width: 100%;
  height: 100%;
  border: none;
}

.add-btn {
  width: 100%;
  height: 100%;
  background: none;
  border: 2px dashed #444;
  color: #888;
  font-size: 40px;
  cursor: pointer;
}
.add-btn:hover {
  border-color: #fff;
  color: #fff;
}

.close-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(255, 0, 0, 0.8);
  color: #fff;
  border: none;
  padding: 4px 10px;
  border-radius: 4px;
  cursor: pointer;
  z-index: 10;
}
</style>
</head>
<body>

<div id="container"></div>

<script>
const STORAGE_KEY = 'simple_live_4grid';
let slots = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [null, null, null, null];

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(slots));
}

function render() {
  const container = document.getElementById('container');
  container.innerHTML = '';

  slots.forEach((id, index) => {
    const box = document.createElement('div');
    box.className = 'stream-box';

    if (id) {
      box.innerHTML = `
        <iframe src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1" allow="autoplay"></iframe>
        <button class="close-btn" onclick="removeStream(${index})">✕</button>
      `;
    } else {
      box.innerHTML = `<button class="add-btn" onclick="addStream(${index})">+</button>`;
    }

    container.appendChild(box);
  });
}

function addStream(index) {
  const url = prompt('輸入 YouTube 直播 / 影片網址:');
  if (!url) return;
  
  const match = url.match(/(?:v=|youtu\.be\/|live\/)([a-zA-Z0-9_-]{11})/);
  if (match) {
    slots[index] = match[1];
    save();
    render();
  } else {
    alert('無效的 YouTube 連結');
  }
}

function removeStream(index) {
  slots[index] = null;
  save();
  render();
}

render();
</script>

</body>
</html>
